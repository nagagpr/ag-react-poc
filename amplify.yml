version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node 20.19+ or 22.12+; the Amplify default image may be older.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
